<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Waste Detection</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <main class="shell">
    <header><p class="eyebrow">COMPUTER VISION FOR RECYCLING</p><h1>Waste Detection System</h1>
      <p>Upload an image to detect glass, plastic, metal, paper, cardboard, and trash.</p>
      <a href="{{ url_for('live') }}">Use webcam instead →</a></header>
    <section class="panel">
      <label class="drop" for="image-file"><span>Choose an image</span><small>PNG, JPEG, or WebP · up to 10 MB</small></label>
      <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp">
      <div class="actions"><button id="detect" disabled>Detect waste</button><span id="status" role="status"></span></div>
      <div class="results"><figure><figcaption>Selected image</figcaption><img id="preview" alt="Selected image preview" hidden></figure>
        <figure><figcaption>Detection result</figcaption><img id="result" alt="Annotated detection result" hidden></figure></div>
    </section>
    <footer>Prototype only. Predictions may be incorrect and are not disposal guidance.</footer>
  </main>
  <script src="{{ url_for('static', filename='js/upload.js') }}" defer></script>
</body>
</html>
