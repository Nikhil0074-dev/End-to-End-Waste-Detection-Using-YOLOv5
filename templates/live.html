<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Live Waste Detection</title><link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><main class="shell"><header><p class="eyebrow">WEBCAM CAPTURE</p><h1>Live image detection</h1><p>Start the camera, capture a still frame, then run detection.</p><a href="{{ url_for('index') }}">← Upload an image</a></header>
<section class="panel"><video id="camera" autoplay playsinline muted></video><canvas id="capture" hidden></canvas>
<div class="actions"><button id="start">Start camera</button><button id="snap" disabled>Capture frame</button><button id="stop" disabled>Stop camera</button><span id="status" role="status"></span></div>
<img id="result" alt="Annotated webcam capture" hidden></section></main><script src="{{ url_for('static', filename='js/webcam.js') }}" defer></script></body></html>
